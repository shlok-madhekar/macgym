<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MacGym</title>
<script>if (new URLSearchParams(location.search).get("embed") === "1") document.documentElement.classList.add("embed");</script>
<link rel="stylesheet" href="/probe0/tokens.css">
<link rel="stylesheet" href="/probe0/base.css">
<link rel="stylesheet" href="/probe0/buttons.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <header class="top">
    <div class="brand">
      <span class="wordmark">MacGym</span>
      <span class="subtitle">Train robots on a Mac GPU</span>
    </div>
    <nav class="tabs" id="tabs">
      <button data-env="walker" class="on">Walker</button>
      <button data-env="cheetah">Cheetah</button>
      <button data-env="arm">Arm</button>
      <button data-env="cartpole">Cartpole</button>
    </nav>
    <div class="controls">
      <nav class="links mono"><a href="/playground">Playground</a><a href="/docs/">Docs</a></nav>
      <label class="count">
        <span class="mono">Robots</span>
        <select id="count">
          <option value="1024">1,024</option>
          <option value="4096" selected>4,096</option>
          <option value="16384">16,384</option>
        </select>
      </label>
      <button id="load" class="textbtn px-btn px-btn--plain">Load trained</button>
      <button id="train" class="primary px-btn px-btn--push px-btn--accent">Train</button>
    </div>
  </header>

  <section class="hero" id="hero">
    <div class="hero-label xp" id="heroLabel">Track</div>
    <div class="hero-note mono" id="heroNote"></div>
    <div class="hero-help" id="heroHelp"></div>
    <canvas id="track"></canvas>
    <div class="ready" id="ready">
      <div class="ready-main" id="readyMain">4,096 robots ready. Press Train.</div>
      <div class="ready-sub mono" id="readySub">Every robot starts at 0 m. Watch the crowd move right as it learns.</div>
    </div>
  </section>

  <section class="lower">
    <div class="progress">
      <div class="headline">
        <div class="hl-value"><span id="hlNum">–</span><span class="hl-unit" id="hlUnit">m</span></div>
        <div class="hl-label">
          <span id="hlLabel">average distance walked</span>
          <span class="mono muted" id="hlSub">no run yet</span>
        </div>
      </div>
      <canvas id="chart"></canvas>
    </div>
    <div class="gens">
      <div class="gens-head">
        <span class="mono">Generations</span>
        <span class="mono muted" id="gensNote">one robot, fresh start, no exploration noise, up to 8 s</span>
      </div>
      <div class="gens-row" id="gens"></div>
    </div>
  </section>

  <footer class="foot mono" id="foot">connecting…</footer>
</div>
<script src="demo.js"></script>
<script src="track.js"></script>
<script src="app.js"></script>
</body>
</html>
