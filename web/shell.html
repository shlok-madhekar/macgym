<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>MacGym</title>
<link rel="stylesheet" href="/probe0/tokens.css">
<link rel="stylesheet" href="/probe0/base.css">
<link rel="stylesheet" href="/probe0/chrome/chrome-base.css">
<link rel="stylesheet" href="/probe0/chrome/frame.css">
<link rel="stylesheet" href="/probe0/chrome/titlebar.css">
<link rel="stylesheet" href="/probe0/chrome/sidebar.css">
<link rel="stylesheet" href="/probe0/chrome/content.css">
<link rel="stylesheet" href="/shell.css">
</head>
<body>
<div class="chrome-frame" id="frame">
  <header class="titlebar">
    <div class="titlebar__lead"></div>
    <h1 class="titlebar__title" id="title">Playground</h1>
    <div class="titlebar__trail"></div>
  </header>

  <div class="chrome-frame__body">
    <div class="chrome-frame__sidebar">
      <nav class="source-list" aria-label="Main navigation">
        <div class="shell-brand">
          <span class="shell-brand__mark" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12.5 6.5 5l3 4 3.5-6.5"/><circle cx="3" cy="12.5" r="1.25"/><circle cx="6.5" cy="5" r="1.25"/><circle cx="9.5" cy="9" r="1.25"/><circle cx="13" cy="2.75" r="1.25"/></svg>
          </span>
          <span class="shell-brand__name">MacGym</span>
        </div>

        <div class="source-list__scroll" id="list">
          <section class="source-list__group" aria-labelledby="sl-workspace">
            <h2 class="source-list__header" id="sl-workspace">Workspace</h2>
            <button type="button" class="source-list__row" data-view="playground">
              <span class="source-list__icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 4.5 2 8l3.5 3.5M10.5 4.5 14 8l-3.5 3.5M9 3 7 13"/></svg></span>
              <span class="source-list__label">Playground</span>
            </button>
            <button type="button" class="source-list__row" data-view="slides">
              <span class="source-list__icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2.75" width="12" height="8" rx="1.25"/><path d="M8 10.75v2.5M5.5 13.5h5"/></svg></span>
              <span class="source-list__label">Slides</span>
            </button>
            <button type="button" class="source-list__row" data-view="viewer">
              <span class="source-list__icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.75 13.75 5v6L8 14.25 2.25 11V5L8 1.75Z M2.25 5 8 8.25 13.75 5 M8 8.25v6"/></svg></span>
              <span class="source-list__label">Viewer</span>
            </button>
            <button type="button" class="source-list__row" data-view="docs">
              <span class="source-list__icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.75h5.5L12.5 4.75v9.5H4V1.75Z M9.25 1.75v3.25h3.25 M6 8h4.5M6 10.5h4.5"/></svg></span>
              <span class="source-list__label">Docs</span>
            </button>
          </section>

          <section class="source-list__group" aria-labelledby="sl-robots">
            <h2 class="source-list__header" id="sl-robots">Robots</h2>
            <button type="button" class="source-list__row" data-robot="walker">
              <span class="source-list__icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v5M8 7.5 5.5 10.5v3.5M8 7.5l2.5 3v3.5"/><circle cx="8" cy="2.5" r="1"/></svg></span>
              <span class="source-list__label">walker</span>
            </button>
            <button type="button" class="source-list__row" data-robot="cheetah">
              <span class="source-list__icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5h9l2-1.5M4 6.5 3 9.5l1.5 3.5M11 6.5l1.5 3-1.5 3.5"/></svg></span>
              <span class="source-list__label">cheetah</span>
            </button>
            <button type="button" class="source-list__row" data-robot="hopper">
              <span class="source-list__icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4L6 9.5l2.5 3M6.5 13.75h5"/><circle cx="8" cy="2.5" r="1"/></svg></span>
              <span class="source-list__label">hopper</span>
            </button>
            <button type="button" class="source-list__row" data-robot="tripod">
              <span class="source-list__icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4.5V13.5M8 4.5 3 13.5M8 4.5l5 9"/><circle cx="8" cy="3.5" r="1.5"/></svg></span>
              <span class="source-list__label">tripod</span>
            </button>
            <button type="button" class="source-list__row" data-robot="worm">
              <span class="source-list__icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M1.75 9.5c1.5-3.5 3-3.5 4.25 0s2.75 3.5 4.25 0 2.75-3.5 4 0"/></svg></span>
              <span class="source-list__label">worm</span>
            </button>
          </section>
        </div>

        <div class="source-list__footer">
          <div class="shell-machine">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="8" height="8" rx="1.25"/><path d="M6.5 1.75V4M9.5 1.75V4M6.5 12v2.25M9.5 12v2.25M1.75 6.5H4M1.75 9.5H4M12 6.5h2.25M12 9.5h2.25"/></svg>
            <span>Apple M3 Pro</span>
          </div>
        </div>
      </nav>
    </div>

    <main class="content-pane shell-content">
      <iframe id="view" class="shell-view" title="MacGym" allow="fullscreen; clipboard-read; clipboard-write" allowfullscreen></iframe>
    </main>
  </div>
</div>
<script src="/shell.js"></script>
</body>
</html>
