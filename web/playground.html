<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MacGym Playground</title>
<script>if (new URLSearchParams(location.search).get("embed") === "1") document.documentElement.classList.add("embed");</script>
<link rel="stylesheet" href="/probe0/tokens.css">
<link rel="stylesheet" href="/probe0/base.css">
<link rel="stylesheet" href="/probe0/buttons.css">
<link rel="stylesheet" href="/probe0/inputs.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="playground.css">
</head>
<body class="pg">
<div class="pg-page">
  <!-- minimal title row, hidden when embedded in the shell (?embed=1) -->
  <header class="pg-title">
    <span class="wordmark">MacGym</span>
    <nav class="tabs">
      <a class="on" href="/playground">Playground</a>
      <a href="/viewer">Viewer</a>
      <a href="/docs/">Docs</a>
    </nav>
  </header>

  <!-- toolbar row -->
  <div class="pg-toolbar">
    <div class="tb-left">
      <span class="px-select px-select--plain file-select">
        <select id="preset" class="px-select__input">
          <option value="walker">walker.py</option>
          <option value="cheetah">cheetah.py</option>
          <option value="hopper">hopper.py</option>
          <option value="tripod" selected>tripod.py</option>
          <option value="worm">worm.py</option>
          <option value="blank">blank.py</option>
        </select>
      </span>
      <span class="tb-meta" id="meta"></span>
      <span class="dirty" id="dirty">edited</span>
    </div>
    <div class="tb-right ed-actions">
      <label class="count">
        <span class="lbl">Copies</span>
        <span class="px-select">
          <select id="count" class="px-select__input">
            <option value="1024">1,024</option>
            <option value="4096" selected>4,096</option>
            <option value="16384">16,384</option>
          </select>
        </span>
      </label>
      <button id="run" class="px-btn px-btn--push px-btn--accent run"><span class="run-label">Run</span><kbd>⌘↵</kbd></button>
    </div>
  </div>

  <main class="pg-main">
    <section class="pg-left">
      <div class="editor" id="editor"></div>
      <div class="console">
        <div class="console-head"><span class="sec-h">Console</span><span class="conn" id="conn"></span></div>
        <div class="console-body" id="console"></div>
      </div>
    </section>

    <section class="pg-right">
      <div class="pg-stage">
        <div class="stage-head">
          <div class="stat" id="stageLabel"></div>
          <div class="stage-hint" id="stageHint"></div>
        </div>
        <canvas id="stage"></canvas>
      </div>
      <div class="pg-lower">
        <div class="progress pg-progress">
          <div class="sec-h">Progress</div>
          <div class="headline">
            <div class="hl-value"><span id="hlNum">–</span><span class="hl-unit" id="hlUnit">m</span></div>
            <div class="hl-label"><span id="hlLabel">average distance</span></div>
          </div>
          <canvas id="chart"></canvas>
        </div>
        <div class="gens pg-gens">
          <div class="gens-head"><span class="sec-h">Generations</span></div>
          <div class="gens-row" id="gens"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- legacy hooks (kept so playground.js keeps working; intentionally not shown) -->
  <div hidden>
    <span id="machine"></span><span id="stageNote"></span><span id="hlSub"></span><span id="gensNote"></span>
    <div id="edStatus"><span id="edPos"></span><span id="edMsg"></span></div>
    <footer id="foot"></footer>
  </div>
</div>
<script src="track.js"></script>
<script type="module" src="playground.js"></script>
</body>
</html>
